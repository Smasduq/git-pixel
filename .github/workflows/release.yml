name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          BIN="gitpixel"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/gitpixel" "gitpixel"
          tar -czf "dist/gitpixel-${{ matrix.target }}.tar.gz" gitpixel
          rm gitpixel

      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/gitpixel.exe" "gitpixel.exe"
          cd dist && powershell Compress-Archive -Path ../gitpixel.exe -DestinationPath "gitpixel-${{ matrix.target }}.zip"
          rm ../gitpixel.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitpixel-${{ matrix.target }}
          path: dist/*

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
