[package]
name = "gitpixel"
version = "0.1.0"
edition = "2024"
description = "Draw ASCII text on your GitHub contribution graph using backdated commits"
license = "MIT"
repository = "https://github.com/Smasduq/git-pixel.git"
readme = "README.md"
keywords = ["github", "contribution", "graph", "backdate", "commits"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
git2 = "0.21.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
